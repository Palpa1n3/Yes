# Builds the Windows installer and publishes it as a GitHub Release whenever the version
# in package.json changes on main. Installed copies of ARC update themselves from there.
name: Build and release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run
        # The suite is developed on Linux; don't let a Windows-only quirk block a release.
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Package and publish
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
