# Builds the Windows installer and publishes it as a GitHub Release whenever the version
# in package.json changes on main. Installed copies of ARC update themselves from there.
name: Build and release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run
        # The suite is developed on Linux; don't let a Windows-only quirk block a release.
        continue-on-error: true

      - name: Build
        run: npm run build

      # GitHub refuses to publish a release whose tag doesn't exist yet ("Published releases
      # must have a valid tag"), so make the tag first.
      - name: Tag this version
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "Tag v$V already exists"
          else
            git tag "v$V"
            git push origin "v$V"
          fi

      - name: Package and upload (as a draft release)
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish only once the installer and latest.yml are uploaded, so installed copies
      # never see a release with files missing.
      - name: Publish the release
        shell: bash
        run: gh release edit "v$VERSION" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
