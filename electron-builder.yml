# Packaging: `npm run package:win` on Windows produces an installer and a portable .exe in dist/.
appId: com.arc.assistant
productName: ARC
copyright: ARC
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
  # Transformers.js bundles the browser runtime it needs; the separate package is unused.
  - '!node_modules/onnxruntime-web/**'
asar: true
# A read-only copy of the source, so Alton can read its own code (read_arc_source).
extraResources:
  - { from: src, to: source/src, filter: ['**/*'] }
  - { from: phone/src, to: source/phone/src, filter: ['**/*'] }
  - { from: tests, to: source/tests, filter: ['**/*'] }
  - { from: README.md, to: source/README.md }
  - { from: electron-builder.yml, to: source/electron-builder.yml }
  - { from: electron.vite.config.ts, to: source/electron.vite.config.ts }
  - { from: tsconfig.json, to: source/tsconfig.json }
# Updates: GitHub Actions builds the installer and publishes it as a GitHub Release;
# the installed app checks there (electron-updater). Local builds never publish.
publish:
  provider: github
  owner: Palpa1n3
  repo: Yes
  releaseType: release
# Native speech-recognition runtime (Whisper) must sit outside the asar archive.
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  icon: resources/icon@2x.png
  # Ship only the Windows build of onnxruntime (the package carries every OS).
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v*/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/linux/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ARC
  deleteAppDataOnUninstall: false
mac:
  icon: resources/icon@2x.png
  category: public.app-category.productivity
  target: [dmg]
linux:
  icon: resources/icon@2x.png
  category: Utility
  target: [AppImage]
