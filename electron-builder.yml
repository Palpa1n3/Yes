# Packaging: `npm run package:win` on Windows produces an installer and a portable .exe in dist/.
appId: com.arc.assistant
productName: ARC
copyright: ARC
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asar: true
# Native speech-recognition runtime (Whisper) must sit outside the asar archive.
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  icon: resources/icon@2x.png
  # Ship only the Windows build of onnxruntime (the package carries every OS).
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v*/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/linux/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ARC
  deleteAppDataOnUninstall: false
mac:
  icon: resources/icon@2x.png
  category: public.app-category.productivity
  target: [dmg]
linux:
  icon: resources/icon@2x.png
  category: Utility
  target: [AppImage]
